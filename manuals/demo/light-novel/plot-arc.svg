<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f3ff"/><stop offset="1" stop-color="#eef9ff"/></linearGradient>
    <linearGradient id="string" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#315fda"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#0f9d8d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#26354d" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="52" y="62" font-family="Yu Gothic, sans-serif" font-size="30" font-weight="700" fill="#233656">全5章プロット — 技と信頼のループ</text>
  <text x="52" y="96" font-family="Yu Gothic, sans-serif" font-size="16" fill="#687894">ヨーヨーの軌道が、離れていた二人を結び直す</text>
  <path d="M112 306 C205 128, 320 482, 438 302 S676 120, 794 302 S1027 478, 1090 284" fill="none" stroke="url(#string)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Yu Gothic, sans-serif" filter="url(#shadow)">
    <g><circle cx="116" cy="306" r="70" fill="#ffffff" stroke="#6d91e8" stroke-width="4"/><text x="116" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#274a9d">第1章</text><text x="116" y="316" text-anchor="middle" font-size="17" fill="#334b77">落下と一投</text><text x="116" y="342" text-anchor="middle" font-size="14" fill="#72819a">異世界転移</text></g>
    <g><circle cx="354" cy="306" r="70" fill="#ffffff" stroke="#8f76d9" stroke-width="4"/><text x="354" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#5c469d">第2章</text><text x="354" y="316" text-anchor="middle" font-size="17" fill="#574a78">工房の相棒</text><text x="354" y="342" text-anchor="middle" font-size="14" fill="#7f7395">共闘の試作</text></g>
    <g><circle cx="592" cy="306" r="70" fill="#ffffff" stroke="#e2a55e" stroke-width="4"/><text x="592" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#9a5d24">第3章</text><text x="592" y="316" text-anchor="middle" font-size="17" fill="#765735">王都競技祭</text><text x="592" y="342" text-anchor="middle" font-size="14" fill="#917a63">最強の証明</text></g>
    <g><circle cx="830" cy="306" r="70" fill="#ffffff" stroke="#dd6b7b" stroke-width="4"/><text x="830" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#9b3448">第4章</text><text x="830" y="316" text-anchor="middle" font-size="17" fill="#794855">切れた天糸</text><text x="830" y="342" text-anchor="middle" font-size="14" fill="#94727a">敗北と告白</text></g>
    <g><circle cx="1068" cy="306" r="70" fill="#ffffff" stroke="#4db5a2" stroke-width="4"/><text x="1068" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#287b6d">第5章</text><text x="1068" y="316" text-anchor="middle" font-size="17" fill="#3b6d64">廻天の一投</text><text x="1068" y="342" text-anchor="middle" font-size="14" fill="#698b84">世界樹を救う</text></g>
  </g>
  <g font-family="Yu Gothic, sans-serif">
    <rect x="178" y="456" width="844" height="104" rx="18" fill="#ffffff" stroke="#d9d5ec" stroke-width="3"/>
    <text x="212" y="496" font-size="18" font-weight="700" fill="#3e3a66">感情の芯</text>
    <text x="212" y="532" font-size="16" fill="#6c6688">「一人で勝つ技」から「誰かを信じて戻ってくる糸」へ</text>
  </g>
</svg>
